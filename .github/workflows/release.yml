name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests (the ones that need game files are skipped)
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
      - name: Build FC6CoopPatcher.exe
        shell: pwsh
        run: ./build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FC6CoopPatcher
          path: dist/FC6CoopPatcher.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FC6CoopPatcher.exe
